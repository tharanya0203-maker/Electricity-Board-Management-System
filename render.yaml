services:
  - name: smart-electricity-backend
    type: web
    env: node
    buildCommand: "npm install"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
    autoDeploy: false

databases:
  - name: smart-electricity-db
    databaseName: smart_electricity_db
    user: smart_electricity_user
    region: ohio